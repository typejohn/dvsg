<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DVSG</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0f;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  .cards {
    display: flex;
    gap: 2rem;
    padding: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .glow-card {
    --base: 220;
    --spread: 200;
    --radius: 14;
    --border: 3;
    --size: 200;
    --outer: 1;
    --backdrop: hsl(0 0% 60% / 0.12);
    --backup-border: hsl(0 0% 60% / 0.12);
    --border-size: calc(var(--border) * 1px);
    --spotlight-size: calc(var(--size) * 1px);
    --x: 50vw;
    --y: 50vh;
    --xp: 0.5;
    --yp: 0.5;
    --hue: calc(var(--base) + (var(--xp) * var(--spread)));

    width: 14rem;
    aspect-ratio: 3/4;
    border-radius: 1rem;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    border: var(--border-size) solid var(--backup-border);
    background-color: var(--backdrop);
    background-image: radial-gradient(
      var(--spotlight-size) var(--spotlight-size) at
      calc(var(--x) * 1px)
      calc(var(--y) * 1px),
      hsl(var(--hue) 100% 70% / 0.15),
      transparent
    );
    background-size: calc(100% + (2 * var(--border-size))) calc(100% + (2 * var(--border-size)));
    background-position: 50% 50%;
    background-attachment: fixed;
    box-shadow: 0 1rem 2rem -1rem #000;
    backdrop-filter: blur(5px);
    transition: transform 0.2s ease;
  }

  .glow-card:hover {
    transform: translateY(-2px);
  }

  /* Inner glow layer */
  .glow-card > .glow-inner {
    position: absolute;
    inset: 0;
    border-radius: calc(var(--radius) * 1px);
    opacity: var(--outer);
    border: calc(var(--border-size) * 20) solid transparent;
    filter: blur(calc(var(--border-size) * 10));
    pointer-events: none;
  }

  /* Pseudo-elements for border spotlight */
  .glow-card::before,
  .glow-card::after {
    pointer-events: none;
    content: "";
    position: absolute;
    inset: calc(var(--border-size) * -1);
    border: var(--border-size) solid transparent;
    border-radius: calc(var(--radius) * 1px);
    background-attachment: fixed;
    background-size: calc(100% + (2 * var(--border-size))) calc(100% + (2 * var(--border-size)));
    background-repeat: no-repeat;
    background-position: 50% 50%;
    mask: linear-gradient(transparent, transparent), linear-gradient(white, white);
    mask-clip: padding-box, border-box;
    mask-composite: intersect;
  }

  .glow-card::before {
    background-image: radial-gradient(
      calc(var(--spotlight-size) * 0.75) calc(var(--spotlight-size) * 0.75) at
      calc(var(--x) * 1px)
      calc(var(--y) * 1px),
      hsl(var(--hue) 100% 50% / 1),
      transparent 100%
    );
    filter: brightness(2);
  }

  .glow-card::after {
    background-image: radial-gradient(
      calc(var(--spotlight-size) * 0.5) calc(var(--spotlight-size) * 0.5) at
      calc(var(--x) * 1px)
      calc(var(--y) * 1px),
      hsl(0 100% 100% / 1),
      transparent 100%
    );
  }

  /* Letter styling */
  .letter {
    position: relative;
    z-index: 1;
    font-size: 6rem;
    font-weight: 800;
    color: hsl(var(--hue) 80% 85% / 0.9);
    text-shadow: 0 0 40px hsl(var(--hue) 100% 60% / 0.4),
                 0 0 80px hsl(var(--hue) 100% 60% / 0.2);
    user-select: none;
    pointer-events: none;
    transition: text-shadow 0.1s linear;
  }
</style>
</head>
<body>
<div class="cards">
  <div class="glow-card" style="--base:220;">
    <div class="glow-inner"></div>
    <span class="letter">D</span>
  </div>
  <div class="glow-card" style="--base:280;">
    <div class="glow-inner"></div>
    <span class="letter">V</span>
  </div>
  <div class="glow-card" style="--base:120;">
    <div class="glow-inner"></div>
    <span class="letter">S</span>
  </div>
  <div class="glow-card" style="--base:0;">
    <div class="glow-inner"></div>
    <span class="letter">G</span>
  </div>
</div>

<script>
  document.addEventListener('pointermove', (e) => {
    const x = e.clientX.toFixed(2);
    const y = e.clientY.toFixed(2);
    const xp = (e.clientX / window.innerWidth).toFixed(4);
    const yp = (e.clientY / window.innerHeight).toFixed(4);

    document.querySelectorAll('.glow-card').forEach((card) => {
      card.style.setProperty('--x', x);
      card.style.setProperty('--y', y);
      card.style.setProperty('--xp', xp);
      card.style.setProperty('--yp', yp);
    });
  });
</script>
</body>
</html>
