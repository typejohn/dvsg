<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dvsg</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: sans-serif; }
    #container { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050505; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="thermo-canvas"></canvas>
  </div>

  <script>
    const container = document.getElementById("container");
    const canvas = document.getElementById("thermo-canvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    const RESOLUTION = 12;
    const COOLING_FACTOR = 0.96;

    let grid, cols, rows, width, height;
    const mouse = { x: -1000, y: -1000, prevX: -1000, prevY: -1000, active: false };

    function thermalColor(t) {
      const r = Math.min(255, Math.max(0, t * 2.5 * 255));
      const g = Math.min(255, Math.max(0, (t * 2.5 - 1) * 255));
      const b = Math.min(255, Math.max(0, (t * 2.5 - 2) * 255 + (t * 50)));
      return `rgb(${r + 10}, ${g + 10}, ${b + 15})`;
    }

    function resize() {
      width = container.offsetWidth;
      height = container.offsetHeight;
      canvas.width = width;
      canvas.height = height;
      cols = Math.ceil(width / RESOLUTION);
      rows = Math.ceil(height / RESOLUTION);
      grid = new Float32Array(cols * rows).fill(0);
    }

    function injectHeat(col, row) {
      const radius = 2;
      for (let i = -radius; i <= radius; i++) {
        for (let j = -radius; j <= radius; j++) {
          const c = col + i;
          const r = row + j;
          if (c >= 0 && c < cols && r >= 0 && r < rows) {
            const idx = c + r * cols;
            const d = Math.sqrt(i * i + j * j);
            if (d <= radius) {
              grid[idx] = Math.min(1.0, grid[idx] + 0.3 * (1 - d / radius));
            }
          }
        }
      }
    }

    function update() {
      if (mouse.active) {
        const dx = mouse.x - mouse.prevX;
        const dy = mouse.y - mouse.prevY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const steps = Math.ceil(dist / (RESOLUTION / 2));
        for (let s = 0; s <= steps; s++) {
          const t = steps > 0 ? s / steps : 0;
          const x = mouse.prevX + dx * t;
          const y = mouse.prevY + dy * t;
          injectHeat(Math.floor(x / RESOLUTION), Math.floor(y / RESOLUTION));
        }
      }
      mouse.prevX = mouse.x;
      mouse.prevY = mouse.y;

      ctx.fillStyle = "#050505";
      ctx.fillRect(0, 0, width, height);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = c + r * cols;
          const temp = grid[idx];
          grid[idx] *= COOLING_FACTOR;

          const x = c * RESOLUTION;
          const y = r * RESOLUTION;

          if (temp > 0.05) {
            ctx.fillStyle = thermalColor(temp);
            const size = RESOLUTION * (0.8 + temp * 0.5);
            const offset = (RESOLUTION - size) / 2;
            ctx.fillRect(x + offset, y + offset, size, size);
          } else if (c % 2 === 0 && r % 2 === 0) {
            ctx.fillStyle = "#18181b";
            ctx.fillRect(x + RESOLUTION / 2 - 1, y + RESOLUTION / 2 - 1, 2, 2);
          }
        }
      }

      requestAnimationFrame(update);
    }

    container.addEventListener("mousemove", (e) => {
      const rect = container.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      mouse.active = true;
    });

    container.addEventListener("mouseleave", () => {
      mouse.active = false;
    });

    container.addEventListener("touchmove", (e) => {
      const touch = e.touches[0];
      const rect = container.getBoundingClientRect();
      mouse.x = touch.clientX - rect.left;
      mouse.y = touch.clientY - rect.top;
      mouse.active = true;
    }, { passive: true });

    container.addEventListener("touchend", () => {
      mouse.active = false;
    });

    container.addEventListener("touchcancel", () => {
      mouse.active = false;
    });

    window.addEventListener("resize", resize);
    resize();
    update();
  </script>
</body>
</html>
